name: Unpack Lakad update

# One-time helper. lakad-src.tar.xz (uploaded through the website) holds the source code;
# images, the Gradle wrapper and package-lock.json are rebuilt here so the upload stays small.
# Workflow files are uploaded separately because workflows can't change other workflow files.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Replace project files with the update
        run: |
          test -f lakad-src.tar.xz || { echo "lakad-src.tar.xz not found in the repository root"; exit 1; }
          mkdir -p "$RUNNER_TEMP/src" && tar -xJf lakad-src.tar.xz -C "$RUNNER_TEMP/src"
          test -f "$RUNNER_TEMP/src/package.json" || { echo "Unexpected archive layout"; exit 1; }
          # Keep git data and workflows; replace everything else
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rm -rf "$RUNNER_TEMP/src/.github"
          cp -a "$RUNNER_TEMP/src/." .

      - name: Draw icons and splash screens
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/make-images.py

      - name: Add the Gradle wrapper (official, checksum verified)
        run: |
          curl -sSfL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          echo "2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Rebuild package-lock.json with the exact tested versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --before=2026-10-11T14:00:00Z

      - name: Commit
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lakad app: web, Android and iPhone with lock-screen live stats" || echo "Nothing to commit"
          git push

      - name: Start the Android and iPhone builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-apk.yml --ref "${{ github.ref_name }}"
          gh workflow run ios-app.yml --ref "${{ github.ref_name }}"
