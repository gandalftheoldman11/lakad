<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#070E1C" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Record, analyze and share your walks and runs." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // apply a chosen theme before the app draws, so it never flashes the other one
      try { var l = JSON.parse(localStorage.getItem('lakad.look') || '{}'); if (l.t === 'light' || l.t === 'dark') document.documentElement.dataset.theme = l.t; if (l.a && l.a !== 'blue') document.documentElement.dataset.accent = l.a; } catch (e) {}
    </script>
    <title>Lakad: walk and run tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
